<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee360 - Login</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom stylesheet -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Employee360</a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 col-xl-5">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white text-center">
                        <h3 class="mb-0">Employee360</h3>
                        <small>Administration System</small>
                    </div>
                    <div class="card-body p-4">
                        <form method="POST" action="/login">
                            {% if error %}
                                <div class="alert alert-danger mb-3" role="alert">
                                    {{ error }}
                                </div>
                            {% endif %}
                            <div class="mb-3">
                                <label for="username" class="form-label">Username or Email</label>
                                <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username or email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
                        </form>
                    </div>
                    <div class="card-footer text-center text-secondary small">
                        {/* Forgot credentials link removed - not implementing password reset in Phase 3 */}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/jsbootstrap.bundle.min.js"></script>
</body>
</html>
